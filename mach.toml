[project]
id = "shader"
version = "0.7.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

# the targets this library is meant for. `spirv` is the only one it can be BUILT
# for meaningfully - see the README's shader-only note - and the CPU tuples are
# here so `mach check` runs over the module on an ordinary host.
[target.spirv]
arch = "spirv"
sys  = "vulkan"
abi  = "shader"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi  = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys  = "linux"
abi  = "aapcs64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.shader]
kind = "static"
entry = "lib/shader.mach"
out = "{project.work}/lib/shader"
targets = ["linux-x86_64", "linux-aarch64"]
link = []
need = []
default = true
export = true
