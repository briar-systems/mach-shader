name: CI

# the family's tiered pipeline (briar-systems/.github mach-lib.yml). the library
# is bodyless declarations, so the leg builds conform/, a shader that calls every
# declared entry, and .github/ci/verify.sh validates what it emits. a pull
# request into dev and into main run the same single linux leg. nothing runs on
# push.

on:
  pull_request:
  # release.yml calls this with heavy: all for a tag, which has no base branch
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all]

permissions:
  contents: read

jobs:
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      # conform declares only a release profile
      profiles: '["release"]'
      # every declaration is bodyless, so there is nothing for mach test to run
      test: false
      legs: '[{"name": "x86_64-linux", "runs-on": "ubuntu-latest", "apt": ["spirv-tools"]}]'
      subprojects: '[{"path": "conform", "build": true, "test": false}]'

  gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
