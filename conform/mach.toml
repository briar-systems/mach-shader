# A shader that calls one entry from every family at every width.
#
# The library itself cannot be built into anything: it is 134 bodyless
# declarations, so `mach build` on it emits nothing and proves nothing. This
# project is the actual check. A decorator naming an instruction that does not
# exist, or a signature SPIR-V will not accept at that width, fails here and
# nowhere else.

[project]
id      = "conform"
version = "0.1.0"
mach    = "^5.3"
src     = "src"
out     = "out"

[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"
of  = "spv"

[profile.release]
opt   = 2
debug = false
simd  = "scalarize"
vectorize = false
float_reassoc = false

[artifact.conform_frag]
kind    = "bin"
entry   = "conform_frag.mach"
out     = "conform_frag.spv"
targets = ["spirv"]
link    = []
need    = []

[dep.shader]
path = ".."

# the texture handles, bound and read one of every declared shape. Its own artifact
# rather than more of `conform_frag`: a handle is bound at a descriptor and a maths
# entry is not, so the two shaders have no declarations in common.
[artifact.conform_tex_frag]
kind    = "bin"
entry   = "conform_tex_frag.mach"
out     = "conform_tex_frag.spv"
targets = ["spirv"]
link    = []
need    = []
