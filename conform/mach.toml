# The conformance shaders, one of them calling every entry in `shader.math`.
#
# The library itself cannot be built into anything: it is nothing but bodyless
# declarations, so `mach build` on it emits nothing and proves nothing. This
# project is the actual check. A decorator naming an instruction that does not
# exist, or a signature SPIR-V will not accept at that width, fails here and
# nowhere else.

[project]
id      = "conform"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{profile.name}"

[target.spirv]
arch = "spirv"
sys  = "vulkan"
abi  = "shader"

# both optimization levels, so a constant operand a wrapper writes in its own body is
# shown to reach the instruction as a constant whether or not the wrapper is inlined
[profile.debug]
default = true
optimize = false
debug = false
simd  = "scalarize"

[profile.release]
optimize = true
debug = false
simd  = "scalarize"

[artifact.conform_frag]
kind    = "module"
entry   = "conform_frag.mach"
out     = "{project.work}/conform_frag.spv"
targets = ["spirv"]
link    = []
need    = []

[dep.shader]
path = ".."

# the texture handles, bound and read one of every declared shape. Its own artifact
# rather than more of `conform_frag`: a handle is bound at a descriptor and a maths
# entry is not, so the two shaders have no declarations in common.
[artifact.conform_tex_frag]
kind    = "module"
entry   = "conform_tex_frag.mach"
out     = "{project.work}/conform_tex_frag.spv"
targets = ["spirv"]
link    = []
need    = []

# a compute stage: its workgroup size, its built-ins and its storage buffers. Its own
# artifact because a compute stage binds buffers rather than varyings, so it shares
# no interface with the fragment shaders.
[artifact.conform_comp]
kind    = "module"
entry   = "conform_comp.mach"
out     = "{project.work}/conform_comp.spv"
targets = ["spirv"]
link    = []
need    = []

# every atomic, on a storage buffer and on workgroup memory
[artifact.conform_atomic_comp]
kind    = "module"
entry   = "conform_atomic_comp.mach"
out     = "{project.work}/conform_atomic_comp.spv"
targets = ["spirv"]
link    = []
need    = []

# the texture reads that are not a plain sample: depth comparisons, gathers, fetches
# and queries
[artifact.conform_sample_frag]
kind    = "module"
entry   = "conform_sample_frag.mach"
out     = "{project.work}/conform_sample_frag.spv"
targets = ["spirv"]
link    = []
need    = []

# every storage image and texel buffer, read, written, queried and reached by an atomic
[artifact.conform_image_comp]
kind    = "module"
entry   = "conform_image_comp.mach"
out     = "{project.work}/conform_image_comp.spv"
targets = ["spirv"]
link    = []
need    = []

# every barrier, raw and through the wrappers, at both optimization levels
[artifact.conform_sync_comp]
kind    = "module"
entry   = "conform_sync_comp.mach"
out     = "{project.work}/conform_sync_comp.spv"
targets = ["spirv"]
link    = []
need    = []

# every subgroup operation, over every value type it takes
[artifact.conform_subgroup_comp]
kind    = "module"
entry   = "conform_subgroup_comp.mach"
out     = "{project.work}/conform_subgroup_comp.spv"
targets = ["spirv"]
link    = []
need    = []

# every comparison, every logical operation and selection, and every lane operation, each
# calling every declaration of its module from a compute stage, whose values come from a
# buffer so the module holds only the comparisons and selects the shader called
[artifact.conform_compare_comp]
kind    = "module"
entry   = "conform_compare_comp.mach"
out     = "{project.work}/conform_compare_comp.spv"
targets = ["spirv"]
link    = []
need    = []

[artifact.conform_logic_comp]
kind    = "module"
entry   = "conform_logic_comp.mach"
out     = "{project.work}/conform_logic_comp.spv"
targets = ["spirv"]
link    = []
need    = []

[artifact.conform_vector_comp]
kind    = "module"
entry   = "conform_vector_comp.mach"
out     = "{project.work}/conform_vector_comp.spv"
targets = ["spirv"]
link    = []
need    = []
